name: Forge 1.12.2 bootstrap build

on:
  push:
    paths:
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  pull_request:
    paths:
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-1.12.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'
      - name: Build Forge mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: sodium-forge-1.12.2
          path: legacy-1.12.2/build/libs/*.jar
