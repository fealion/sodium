name: Forge 1.12.2 Sodium-derived renderer

on:
  push:
    paths:
      - '.gitmodules'
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  pull_request:
    paths:
      - '.gitmodules'
      - 'legacy-1.12.2/**'
      - '.github/workflows/legacy-1122.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Add GTNH releases repository for the RFG plugin marker
        working-directory: legacy-1.12.2/renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("settings.gradle")
          s = p.read_text()
          needle = "        maven {\n            // RetroFuturaGradle"
          replacement = """        maven {
                    name 'GTNH Releases'
                    url 'https://nexus.gtnewhorizons.com/repository/releases/'
                }
        maven {
            // RetroFuturaGradle"""
          if needle not in s:
              raise SystemExit("Could not locate the RFG plugin repository block")
          p.write_text(s.replace(needle, replacement, 1))
          PY
      - name: Build pinned Relictium renderer
        working-directory: legacy-1.12.2/renderer
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: sodium-derived-forge-1.12.2
          path: legacy-1.12.2/renderer/build/libs/*.jar
          if-no-files-found: error
